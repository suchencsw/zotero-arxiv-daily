name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled events are best-effort and can occasionally be delayed
    # or dropped. Spread attempts across the day (Asia/Shanghai 11:17, 15:17,
    # 19:17, and 23:17); the guard below allows only one successful delivery.
    - cron: '17 3 * * *'
    - cron: '17 7 * * *'
    - cron: '17 11 * * *'
    - cron: '17 15 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: zotero-arxiv-daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check whether today's delivery already succeeded
        id: delivery_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          SHOULD_RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY_UTC="$(date -u +%F)"
            if RUNS_JSON="$(gh api "repos/$REPOSITORY/actions/workflows/main.yml/runs?status=success&per_page=30")"; then
              PREVIOUS_SUCCESS="$(
                printf '%s' "$RUNS_JSON" | jq -r \
                  --arg today "$TODAY_UTC" \
                  --argjson current "$CURRENT_RUN_ID" \
                  '.workflow_runs[] | select(.id != $current and .conclusion == "success" and (.created_at | startswith($today))) | .id' \
                  | head -n 1
              )"
              if [ -n "$PREVIOUS_SUCCESS" ]; then
                SHOULD_RUN=false
                echo "A scheduled email run already succeeded today: $PREVIOUS_SUCCESS"
              fi
            else
              echo "::warning::Could not inspect prior runs; continuing with delivery."
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.delivery_guard.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Setup uv
        if: steps.delivery_guard.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Run script
        if: steps.delivery_guard.outputs.should_run == 'true'
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          test -n "$ZOTERO_ID"
          test -n "$ZOTERO_KEY"
          test -n "$SENDER"
          test -n "$RECEIVER"
          test -n "$SENDER_PASSWORD"
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_API_BASE"
          test -n "$CUSTOM_CONFIG"
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
