name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      recovery_batch:
        description: "Optional saved announcement batch YYYY-MM-DD, explicitly marked historical"
        required: false
        default: ""
      verify_only:
        description: "Fetch and rank with current Zotero, without sending email"
        type: boolean
        default: false
      force_send:
        description: "Explicitly resend even if SMTP delivery was already acknowledged"
        type: boolean
        default: false
  schedule:
    # Re-register the schedule; four cloud attempts, no local watchdog.
    # GitHub scheduling remains best-effort, not a guaranteed timer.
    - cron: '23 1,5,9,13 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: zotero-arxiv-daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      EMAIL_RECOVERY_BATCH: ${{ inputs.recovery_batch || '' }}
      EMAIL_DRY_RUN: ${{ inputs.verify_only && 'true' || 'false' }}
      EMAIL_FORCE_SEND: ${{ inputs.force_send && 'true' || 'false' }}
      EMAIL_DELIVERY_RECEIPT: outputs/smtp-receipt.json
      EMAIL_PREVIEW_PATH: outputs/email-preview.html
      ARXIV_BATCH_TRACKING: "true"
      # Preserve the currently configured email RSS scopes and their query order.
      ARXIV_BATCH_CATEGORIES: "cs.AI,cs.LG,cs.CV,cs.RO,cs.GR"
      ARXIV_FORCE_SEND: ${{ inputs.force_send && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Queue public announcement batches and retry unfinished delivery
        id: delivery_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$EMAIL_RECOVERY_BATCH" ]; then
            python scripts/email_delivery_guard.py
          else
            python scripts/announcement_batches.py --channel email
          fi

      - name: Setup uv
        if: steps.delivery_guard.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Fetch current Zotero, rank papers and send email
        if: steps.delivery_guard.outputs.should_run == 'true'
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          EMAIL_EMPTY_ALREADY_SENT: ${{ steps.delivery_guard.outputs.empty_already_sent }}
        run: |
          test -n "$ZOTERO_ID"
          test -n "$ZOTERO_KEY"
          test -n "$SENDER"
          test -n "$RECEIVER"
          test -n "$SENDER_PASSWORD"
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_API_BASE"
          test -n "$CUSTOM_CONFIG"
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          # Never print resolved configuration or credentials into logs.
          uv run src/zotero_arxiv_daily/main.py executor.send_empty=false

      - name: Preserve the SMTP acknowledgement
        if: always() && hashFiles('outputs/smtp-receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: email-smtp-receipt
          path: outputs/smtp-receipt.json
          retention-days: 30
          if-no-files-found: error

      - name: Record confirmed announcement batch delivery
        if: always() && hashFiles('outputs/smtp-receipt.json') != '' && env.ARXIV_BATCH_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/announcement_batches.py --channel email --record outputs/smtp-receipt.json

      - name: Record recommended IDs for future period recall
        if: always() && hashFiles('outputs/smtp-receipt.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/periodic_review.py --channel email --record-daily outputs/smtp-receipt.json

      - name: Preserve rendered email for diagnosis
        if: always() && hashFiles('outputs/email-preview.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: outputs/email-preview.html
          retention-days: 7

      - name: Summarize actual delivery state
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path("outputs/smtp-receipt.json")
          if receipt.exists():
              data = json.loads(receipt.read_text())
              text = f"SMTP accepted: {data['kind']}, {data['paper_count']} papers, Beijing date {data['beijing_date']}. Server acceptance does not prove inbox arrival."
          else:
              text = "No new SMTP acknowledgement: skipped, dry-run, or failed. A green workflow is not proof of a new email."
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text + '\n')
          print(text)
          PY
