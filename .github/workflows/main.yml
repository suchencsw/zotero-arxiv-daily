name: Unified daily papers - email and Feishu
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Rank with fresh Zotero and record usage, without sending either channel'
        type: boolean
        default: false
      max_batches:
        description: 'Latest announcement plus optional queued recovery, maximum 3'
        default: '1'
  schedule:
    # Retries of pending channel deliveries, not four independent recommendations.
    - cron: '23 1,5,9,13 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: unified-zotero-recommendations
  cancel-in-progress: false
jobs:
  recommend-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
      ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
      OPENAI_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      OPENAI_BASE_URL: https://api.siliconflow.cn/v1
      PAPERFLOW_LLM_MODEL: zai-org/GLM-5.3-Flash
      PAPERFLOW_EMBED_MODEL: BAAI/bge-m3
      PAPERFLOW_RELEVANCE_REVIEW_MODEL: ''
      PAPERFLOW_COMPACT_REFERENCES: 'true'
      PAPERFLOW_REFERENCE_CONTEXT_LIMIT: '20'
      PAPERFLOW_RESEARCH_SCOPE: '视觉导航、几何计算机视觉、行星探测、具身智能、SLAM、三维重建；根据近期实际Zotero收藏动态更新'
      ARXIV_BATCH_CATEGORIES: 'cs.CV,cs.RO,cs.GR,cs.AI,cs.LG,astro-ph.EP,astro-ph.IM,eess.IV'
      UNIFIED_STATE_KEY: ${{ secrets.UNIFIED_STATE_KEY }}
      SENDER: ${{ secrets.SENDER }}
      RECEIVER: ${{ secrets.RECEIVER }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
      MAX_BATCHES: ${{ inputs.max_batches || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight cloud dependencies
        run: python -m pip install numpy requests openai cryptography
      - name: Restore public vectors and encrypted model checkpoints
        uses: actions/cache/restore@v4
        with:
          path: outputs/unified-cache
          key: unified-bge-m3-v1-${{ github.run_id }}
          restore-keys: unified-bge-m3-v1-
      - name: Compute once and deliver the identical result to both channels
        run: |
          args=(--kind daily --max-batches "$MAX_BATCHES")
          if [ "$VERIFY_ONLY" = true ]; then args+=(--dry-run); fi
          python scripts/unified_push.py "${args[@]}"
      - name: Preserve model checkpoints after success or API failure
        if: always() && hashFiles('outputs/unified-cache/public.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: outputs/unified-cache
          key: unified-bge-m3-v1-${{ github.run_id }}
      - name: Preserve independent actual channel acknowledgements
        if: always() && hashFiles('outputs/unified-receipts.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unified-channel-receipts
          path: outputs/unified-receipts.json
          retention-days: 90
      - name: Preserve ranking and token audit without private Zotero text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-recommendation-audit
          path: outputs/unified/*-audit.json
          retention-days: 30
          if-no-files-found: ignore
